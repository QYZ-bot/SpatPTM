[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatptm-gate-pipeline"
version = "0.1.0"
description = "Reproducible PSSM + SPOT-Contact + GATE + SpatPTM training and inference pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.3,<2",
  "torch>=2.1,<3",
]

[project.scripts]
spatptm-gate = "spatptm_gate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
